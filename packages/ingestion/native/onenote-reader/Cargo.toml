[package]
name = "weaver-onenote-reader"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
cab = "0.6"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
onenote_parser = { path = "vendor/onenote_parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
typed-path = "0.12.3"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "weaver-onenote-reader"
path = "src/main.rs"
